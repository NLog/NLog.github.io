name: 'Build Wiki'

on:
  repository_dispatch:
    types: [build-wiki]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout wiki repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: NLog/NLog.wiki
        path: _wiki/wiki-src
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - run: pip install -r _wiki/requirements.txt
    - run: mkdocs build --config-file _wiki/mkdocs.yml
    - name: Create or update pull request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ github.token }}
        add-paths: wiki/
        branch: build-wiki
        commit-message: Update Wiki
        author: 'NLog.github.io Action <NLog.github.io-action@github.com>'
        committer: 'NLog.github.io Action <NLog.github.io-action@github.com>'
        title: Update Wiki
        body: 'Automated update of the generated wiki site.'